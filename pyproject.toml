[project]
name = "wallex-algo"
version = "0.1.0"
description = "Wallex.ir API client and algorithmic trading experiments"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pandas>=2.2", "pyarrow>=16", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["PYI034", "UP037"]
